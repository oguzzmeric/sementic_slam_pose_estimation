camera_rgb:
  fx: 2680.51
  fy: 2683.39
  cx: 1908.48
  cy: 1139.71
  distortion_coefficients:
    - 0.0798
    - -0.1867
    - 0.0
    - 0.0
    - 0.0
  original_width: 3840
  original_height: 2160
target_resolution:
  width: 3840
  height: 2160
features:
  max_features: 3000
  scale_factor: 1.2
  n_levels: 8
  ransac_threshold: 3.0
  lowe_ratio: 0.75
semantic:
  min_confidence: 0.7
  dynamic_classes:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 8
    - 9
  reference_objects:
    2: 1.5
    3: 4.5
    4: 7.0
    5: 12.0
  dominant_bbox_edge: true
  perspective_correction: true
hybrid:
  min_inlier_count: 40
  deep_feature_interval: 20
evaluation:
  optical_flow_scale: true
  ground_truth_file: data/ground-truth.csv
  altitude_source: gt
  gt_z_is_down: true
  gt_z_offset: 41.6
  warmup_start: 0
  warmup_frames: 150
  calculate_ate: true
  ate_3d: true
  force_2d: false
  min_sim3_samples: 10
  frame_step: 5
persistent_ba:
  # PoseGraph.refine_with_persistent_map -- offline, GTSAM gerektirir
  # (Windows'ta PyPI wheel yok, sadece WSL/Linux'ta calisir). main.py
  # bunu otomatik cagirmaz; ayri bir betikten (refine_trajectory.py)
  # cagrilir.
  window: 15                    # optimizasyon bloklarinin boyutu (kare) -- 25 denendi, kotu cikti (24 Eylul)
  replenish_threshold: 200       # aktif track sayisi bunun altina dusunce kose ekle
  replenish_exclude_radius: 15   # yeni kose, var olan bir track'e bu kadar yakin olmasin
  min_track_len_in_window: 8     # pencere icindeki kirpilmis parca en az bu kadar uzun olmali -- 12 denendi, kotu cikti (24 Eylul)
  max_tracks_per_window: 150
  parallax_cos_threshold: 0.99998
  pixel_noise_sigma: 1.5         # ORB eslesme tipik piksel gurultusu -- tum faktorler bunu paylasir -- 3.0 denendi, degisiklik yaratmadi (24 Eylul)
  anchor_sigma: 1.0e-6
  klt_win_size: 63
  klt_max_level: 6
  klt_fb_threshold: 1.5          # ileri-geri piksel hatasi esigi
logging:
  level: INFO
  log_to_file: false
  log_file: logs/slam.log
